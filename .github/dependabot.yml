version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      composer-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories: [/expert, /inference]
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      pip-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /expert, /inference]
    target-branch: develop
    schedule:
      interval: monthly
