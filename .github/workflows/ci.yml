name: CI

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
  # Called by CD before anything is published.
  workflow_call:
    inputs:
      full:
        description: Run every job regardless of which paths changed.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel a CI run that a CD workflow is waiting for.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      php: ${{ inputs.full || github.event_name == 'workflow_dispatch' || steps.filter.outputs.php == 'true' }}
      frontend: ${{ inputs.full || github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      python: ${{ steps.python.outputs.services }}
      docker: ${{ inputs.full || github.event_name == 'workflow_dispatch' || steps.filter.outputs.docker == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        if: ${{ !inputs.full && github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            php:
              - '.github/workflows/**'
              - 'shared/**'
              - 'app/**'
              - 'bootstrap/**'
              - 'config/**'
              - 'database/**'
              - 'resources/views/**'
              - 'resources/lang/**'
              - 'routes/**'
              - 'tests/**'
              - 'artisan'
              - 'composer.json'
              - 'composer.lock'
              - 'phpunit.xml'
              - 'pint.json'
            frontend:
              - '.github/workflows/**'
              - 'resources/js/**'
              - 'resources/sass/**'
              - 'resources/css/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.js'
            expert:
              - '.github/workflows/**'
              - 'shared/**'
              - 'expert/**'
            inference:
              - '.github/workflows/**'
              - 'shared/**'
              - 'inference/**'
            docker:
              - '.github/workflows/**'
              - 'Dockerfile'
              - 'docker/**'
              - 'inference/Dockerfile'
              - 'expert/Dockerfile'
              - 'compose.yaml'
              - 'compose.prod.yaml'
              - '.dockerignore'
              - '.env.example'
              - 'package.json'
              - 'package-lock.json'
              - 'shared/**'
              - 'app/**'
              - 'bootstrap/**'
              - 'config/**'
              - 'database/**'
              - 'resources/**'
              - 'routes/**'
              - 'expert/**'
              - 'inference/**'

      # Build the Python matrix as a JSON array.
      - id: python
        env:
          ALL: ${{ inputs.full || github.event_name == 'workflow_dispatch' }}
          EXPERT: ${{ steps.filter.outputs.expert }}
          INFERENCE: ${{ steps.filter.outputs.inference }}
        shell: bash
        run: |
          services=()
          if [[ "$ALL" == "true" || "$EXPERT" == "true" ]]; then
            services+=('"expert"')
          fi
          if [[ "$ALL" == "true" || "$INFERENCE" == "true" ]]; then
            services+=('"inference"')
          fi
          printf 'services=[%s]\n' "$(IFS=,; echo "${services[*]}")" >> "$GITHUB_OUTPUT"

  php-lint:
    name: PHP · Pint (changed files)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: cs2pr
      - uses: ramsey/composer-install@v4
      # Legacy code predates Pint: enforce formatting only on files touched by the PR.
      - name: Check changed PHP formatting
        shell: bash
        run: |
          set -o pipefail
          vendor/bin/pint --test --diff="origin/${{ github.base_ref }}" --format=checkstyle | cs2pr

  php-tests:
    name: PHP · Tests (${{ matrix.database }})
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]
    services:
      mysql:
        # Service containers cannot be conditional; the SQLite leg ignores this service.
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: gd, intl, zip, pdo_sqlite, pdo_mysql
          coverage: none
      - uses: ramsey/composer-install@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Point tests at MySQL
        if: matrix.database == 'mysql'
        run: |
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=testing"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD=root"
          } >> "$GITHUB_ENV"
      - name: Run tests
        run: php artisan test --compact --log-junit=junit.xml
      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: junit.xml
          check_name: PHP test report (${{ matrix.database }})
          annotate_only: true

  php-audit:
    name: PHP · Dependency audit
    needs: changes
    if: needs.changes.outputs.php == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

  frontend:
    name: Front-end · Build & audit
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        run: npm run build

  python:
    name: Python · ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.python != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.python) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff (syntax errors and pyflakes)
        run: pipx run ruff check . --select E9,F --target-version py313 --output-format github
      # The services locate shared/ in the repository root when run from a checkout.
      - name: Run tests
        run: python -m pytest tests -q --junitxml=junit.xml
      # Not blocking yet because the current dependency set has a known advisory.
      # Remove continue-on-error after upgrading the affected dependency chain.
      - name: Dependency audit
        continue-on-error: true
        run: |
          pip freeze --exclude-editable > "$RUNNER_TEMP/installed.txt"
          pipx run pip-audit -r "$RUNNER_TEMP/installed.txt" --no-deps --disable-pip --progress-spinner off
      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: ${{ matrix.service }}/junit.xml
          check_name: Python test report (${{ matrix.service }})
          annotate_only: true

  docker:
    name: Docker · Build & smoke test
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # These local tags match compose.yaml for the no-build smoke test.
      - name: Build app
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: sistema-experto:latest
          load: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build inference
        uses: docker/build-push-action@v7
        with:
          context: inference
          build-contexts: shared=shared
          tags: sistema-experto-inference:latest
          load: true
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max
      - name: Build expert
        uses: docker/build-push-action@v7
        with:
          context: expert
          build-contexts: shared=shared
          tags: sistema-experto-expert:latest
          load: true
          cache-from: type=gha,scope=expert
          cache-to: type=gha,scope=expert,mode=max
      - name: Start stack
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
          docker compose up -d --no-build --wait --wait-timeout 180
      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8000/up
          curl --fail --silent --show-error --output /dev/null http://localhost:8000/
          docker compose exec -T expert python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
          docker compose exec -T inference python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down --volumes

  # Configure this single check as required in branch protection.
  # Skipped jobs are accepted only because their path/event conditions can be intentional.
  specs:
    name: Specs · Trazabilidad
    # Cheap and cross-cutting (specs, tests and the scripts): always runs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate specs and test tags
        run: python scripts/spec_check.py
      - name: Spec index
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Specs'
            echo '```'
            python scripts/spec_check.py list
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ci-ok:
    name: CI passed
    if: always()
    needs: [changes, specs, php-lint, php-tests, php-audit, frontend, python, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["RESULTS"])
          if jobs["changes"]["result"] != "success":
              print("Change detection did not succeed.")
              sys.exit(1)

          invalid = {
              name: job["result"]
              for name, job in jobs.items()
              if name != "changes" and job["result"] not in ("success", "skipped")
          }
          if invalid:
              print(f"CI failed: {invalid}")
              sys.exit(1)

          print("CI passed: executed jobs succeeded; conditional jobs were skipped.")
          PY
