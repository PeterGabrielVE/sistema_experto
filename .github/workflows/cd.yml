name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize deployments to main; do not cancel a deployment in progress.
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      full: true
    permissions:
      contents: read
      pull-requests: read

  publish:
    name: Publish · ${{ matrix.image }}
    needs: ci
    # workflow_dispatch can be started from another branch; never publish from it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: sistema-experto
            context: .
            build-contexts: ""
          - image: sistema-experto-inference
            context: inference
            build-contexts: shared=shared
          - image: sistema-experto-expert
            context: expert
            build-contexts: shared=shared
    steps:
      - uses: actions/checkout@v7

      # GHCR image names must be lowercase; repository owner names are not guaranteed lowercase.
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.build-contexts }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Configure DEPLOY_HOST to enable deployment. Secrets and approval rules belong
  # to the GitHub "production" environment.
  deploy:
    name: Deploy · production
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/sistema_experto' }}
      IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            compose.yaml
            compose.prod.yaml
          sparse-checkout-cone-mode: false

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          {
            printf 'Host target\n'
            printf '  HostName %s\n' "$DEPLOY_HOST"
            printf '  User %s\n' "$DEPLOY_USER"
            printf '  IdentityFile ~/.ssh/id_deploy\n'
            printf '  IdentitiesOnly yes\n'
            printf '  StrictHostKeyChecking yes\n'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Upload Compose files
        shell: bash
        run: |
          set -euo pipefail
          ssh target "mkdir -p '$DEPLOY_PATH'"
          scp compose.yaml compose.prod.yaml "target:$DEPLOY_PATH/"

      - name: Log in to GHCR on the server
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" |
            ssh target "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"

      - name: Pull and restart
        shell: bash
        run: |
          set -euo pipefail
          ssh target bash -s -- "$DEPLOY_PATH" "$IMAGE_TAG" "${GITHUB_REPOSITORY_OWNER,,}" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          image_tag="$2"
          image_owner="$3"

          cd "$deploy_path"
          export IMAGE_TAG="$image_tag"
          export IMAGE_OWNER="$image_owner"

          test -f .env || {
            echo ".env is missing in $deploy_path (create it on the server; do not commit it)." >&2
            exit 1
          }

          compose=(docker compose -f compose.yaml -f compose.prod.yaml)
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          "${compose[@]}" config --quiet
          "${compose[@]}" pull
          "${compose[@]}" up -d --no-build --remove-orphans --wait --wait-timeout 300
          docker image prune -f
          REMOTE

      - name: Health check
        if: vars.APP_URL != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 5 --retry-all-errors \
            "${{ vars.APP_URL }}/up"

      - name: Log out from GHCR on the server
        if: always()
        run: ssh target "docker logout ghcr.io" || true
