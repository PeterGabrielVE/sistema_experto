x-laravel-env: &laravel-env
  DB_HOST: db
  INFERENCE_URL: http://inference:8000
  QUEUE_CONNECTION: database

services:
  app:
    build: .
    image: sistema-experto:latest
    env_file: .env
    environment:
      <<: *laravel-env
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - storage:/var/www/html/storage
      - patient-images:/var/www/html/public/patient/images
    depends_on:
      db:
        condition: service_healthy
      # Not required to be healthy: Laravel falls back to the IMC rules.
      inference:
        condition: service_started
    restart: unless-stopped

  # Processes queued jobs and listeners (model retraining, notifications).
  queue:
    image: sistema-experto:latest
    env_file: .env
    environment: *laravel-env
    user: www-data
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  # Runs the Laravel scheduler (nightly model retraining).
  scheduler:
    image: sistema-experto:latest
    env_file: .env
    environment: *laravel-env
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  inference:
    build: ./inference
    image: sistema-experto-inference:latest
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  storage:
  patient-images:
  db-data:
  models:
